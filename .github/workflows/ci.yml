name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: advent-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: Web checks and container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Agile-Data/github-actions/gitleaks-secret-scan@v1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@agile-data'
      - name: Require published shared packages
        run: node scripts/check-published-dependencies.mjs
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.AGILE_DATA_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Verify deployable container
        run: docker build --secret id=NODE_AUTH_TOKEN,env=NODE_AUTH_TOKEN -t advent-ci .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.AGILE_DATA_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
