name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: advent-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: Web checks and container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # This public repository cannot consume our private shared Actions repository.
      - name: Scan git history for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.0'
        run: |
          set -euo pipefail
          SCANNER_DIR=$(mktemp -d)
          trap 'rm -rf "$SCANNER_DIR"' EXIT
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "$BASE/$ARCHIVE" -o "$SCANNER_DIR/$ARCHIVE"
          curl --fail --silent --show-error --location "$BASE/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$SCANNER_DIR/checksums.txt"
          (cd "$SCANNER_DIR" && grep " $ARCHIVE$" checksums.txt | sha256sum --check --strict -)
          tar -xzf "$SCANNER_DIR/$ARCHIVE" -C "$SCANNER_DIR" gitleaks
          "$SCANNER_DIR/gitleaks" git --redact --exit-code 1 .
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@agile-data'
      - name: Require published shared packages
        run: node scripts/check-published-dependencies.mjs
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.AGILE_DATA_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Verify deployable container
        run: docker build --secret id=NODE_AUTH_TOKEN,env=NODE_AUTH_TOKEN -t advent-ci .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.AGILE_DATA_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
